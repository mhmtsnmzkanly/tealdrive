[package]
name = "tealdrive"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "tealdrive"
path = "src/lib.rs"

[[bin]]
name = "tealdrive-server"
path = "src/main.rs"

[[bin]]
name = "tealdrive-helper"
path = "src/bin/tealdrive-helper.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

[features]
default = []
pam-auth = []
