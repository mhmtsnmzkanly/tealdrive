[package]
name = "tealdrive"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tealdrive"
path = "src/lib.rs"

[[bin]]
name = "tealdrive-server"
path = "src/main.rs"

[[bin]]
name = "tealdrive-helper"
path = "src/bin/tealdrive-helper.rs"

[[bin]]
name = "tealdrive-wizard"
path = "src/bin/tealdrive-wizard.rs"

[[bin]]
name = "tealdrive-ctl"
path = "src/bin/tealdrive-ctl.rs"

[dependencies]
libc = "0.2"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "=0.7.3", features = ["tls-rustls-no-provider"] }
rustls-pemfile = "2.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
sha2 = "0.10.9"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
toml = "0.8"
arc-swap = "1.9.2"
notify = "8.2.0"
zeroize = { version = "1.9.1", features = ["derive", "serde"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
hmac = "0.12.1"

[features]
default = []
pam-auth = []

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
